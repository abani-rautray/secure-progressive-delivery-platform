apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
name: backend-app
namespace: argocd

spec:
project: secure-platform-project

source:
repoURL: https://github.com/abani-rautray/secure-progressive-delivery-platform.git

```
targetRevision: HEAD

path: kubernetes/overlays/prod
```

destination:
server: https://kubernetes.default.svc
namespace: production

syncPolicy:
automated:
prune: true
selfHeal: true

```
syncOptions:
  - CreateNamespace=true
```
