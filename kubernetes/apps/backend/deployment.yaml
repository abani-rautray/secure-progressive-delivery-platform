apiVersion: apps/v1
kind: Deployment
metadata:
name: backend
namespace: production

labels:
app: backend
version: stable

spec:
replicas: 3

revisionHistoryLimit: 5

selector:
matchLabels:
app: backend
version: stable

template:
metadata:
labels:
app: backend
version: stable

```
spec:
  serviceAccountName: app-service-account

  containers:
    - name: backend

      image: backend-image:latest

      imagePullPolicy: Always

      ports:
        - containerPort: 8080

      envFrom:
        - configMapRef:
            name: platform-config

        - secretRef:
            name: platform-secret

      resources:
        requests:
          cpu: "500m"
          memory: "512Mi"

        limits:
          cpu: "1"
          memory: "1Gi"

      readinessProbe:
        httpGet:
          path: /health
          port: 8080

        initialDelaySeconds: 5
        periodSeconds: 10

      livenessProbe:
        httpGet:
          path: /health
          port: 8080

        initialDelaySeconds: 15
        periodSeconds: 20
