apiVersion: apps/v1
kind: Deployment
metadata:
name: frontend
namespace: production

labels:
app: frontend

spec:
replicas: 2

revisionHistoryLimit: 5

selector:
matchLabels:
app: frontend

template:
metadata:
labels:
app: frontend

```
spec:
  serviceAccountName: app-service-account

  containers:
    - name: frontend

      image: frontend-image:latest

      imagePullPolicy: Always

      ports:
        - containerPort: 8080

      envFrom:
        - configMapRef:
            name: platform-config

        - secretRef:
            name: platform-secret

      resources:
        requests:
          cpu: "250m"
          memory: "256Mi"

        limits:
          cpu: "500m"
          memory: "512Mi"

      readinessProbe:
        httpGet:
          path: /
          port: 8080

        initialDelaySeconds: 5
        periodSeconds: 10

      livenessProbe:
        httpGet:
          path: /
          port: 8080

        initialDelaySeconds: 15
        periodSeconds: 20
