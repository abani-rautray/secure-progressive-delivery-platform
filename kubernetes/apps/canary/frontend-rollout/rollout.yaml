apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
name: frontend-rollout
namespace: production

labels:
app: frontend

spec:
replicas: 2

revisionHistoryLimit: 5

strategy:
canary:
stableService: frontend-stable-service
canaryService: frontend-canary-service

```
  trafficRouting:
    alb:
      ingress: frontend-ingress
      servicePort: 80

  steps:
    - setWeight: 10
    - pause:
        duration: 60s

    - setWeight: 25
    - pause:
        duration: 120s

    - setWeight: 50
    - pause:
        duration: 180s

    - setWeight: 100
```

selector:
matchLabels:
app: frontend

template:
metadata:
labels:
app: frontend
version: canary

```
spec:
  serviceAccountName: app-service-account

  containers:
    - name: frontend

      image: frontend-image:latest

      imagePullPolicy: Always

      ports:
        - containerPort: 8080

      resources:
        requests:
          cpu: "250m"
          memory: "256Mi"

        limits:
          cpu: "500m"
          memory: "512Mi"

      readinessProbe:
        httpGet:
          path: /
          port: 8080

        initialDelaySeconds: 5
        periodSeconds: 10

      livenessProbe:
        httpGet:
          path: /
          port: 8080

        initialDelaySeconds: 15
        periodSeconds: 20
```
