apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
name: shared-alb-ingress
namespace: production

annotations:
kubernetes.io/ingress.class: alb

```
alb.ingress.kubernetes.io/scheme: internet-facing

alb.ingress.kubernetes.io/target-type: ip

alb.ingress.kubernetes.io/group.name: shared-alb-group

alb.ingress.kubernetes.io/load-balancer-name: shared-platform-alb

alb.ingress.kubernetes.io/listen-ports: |
  [
    {"HTTP": 80},
    {"HTTPS": 443}
  ]

alb.ingress.kubernetes.io/ssl-redirect: "443"

alb.ingress.kubernetes.io/healthcheck-path: /health

alb.ingress.kubernetes.io/success-codes: "200"

alb.ingress.kubernetes.io/backend-protocol: HTTP

alb.ingress.kubernetes.io/tags: |
  Environment=production,
  ManagedBy=argocd,
  Project=secure-platform
```

spec:
ingressClassName: alb

rules:
- host: frontend.example.com

```
  http:
    paths:
      - path: /
        pathType: Prefix

        backend:
          service:
            name: frontend-stable-service

            port:
              number: 80

- host: api.example.com

  http:
    paths:
      - path: /
        pathType: Prefix

        backend:
          service:
            name: backend-stable-service

            port:
              number: 80
```
