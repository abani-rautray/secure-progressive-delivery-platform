name: Terraform Plan

on:
  pull_request:
    paths: [ -terraform/** ]

jobs:
  terraform-plan:
    runs-on: ubuntu-latest


defaults:
  run:
    working-directory: terraform/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan
