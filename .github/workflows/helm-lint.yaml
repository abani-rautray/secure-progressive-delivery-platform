name: Helm Lint

on:
  pull_request:
    paths: [ -helm/**  ]

jobs:
  helm-lint:
    runs-on: ubuntu-latest


    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Helm
      uses: azure/setup-helm@v4

    - name: Helm Lint
      run: |
        find helm -name "values.yaml"
