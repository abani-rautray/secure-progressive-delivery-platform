apiVersion: batch/v1
kind: Job
metadata:
name: kube-bench
namespace: kube-system

spec:
template:
spec:
hostPID: true

```
  containers:
    - name: kube-bench

      image: aquasec/kube-bench:latest

      command:
        - kube-bench

        - --benchmark
        - eks-1.0.1

      securityContext:
        privileged: true

  restartPolicy: Never
```
